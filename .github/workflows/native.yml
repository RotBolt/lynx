name: Native distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :core:model:allTests :apps:native-cli:linkReleaseExecutableMacosArm64 --no-daemon
      - run: mkdir -p dist && cp apps/native-cli/build/bin/macosArm64/releaseExecutable/lynx.kexe dist/lynx
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-macos-arm64
          path: dist/lynx

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :core:model:allTests :apps:native-cli:linkReleaseExecutableLinuxX64 --no-daemon
      - run: mkdir -p dist && cp apps/native-cli/build/bin/linuxX64/releaseExecutable/lynx.kexe dist/lynx
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-linux-x64
          path: dist/lynx

  windows-common:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :core:model:compileKotlinMingwX64 :apps:native-cli:compileKotlinMingwX64 --no-daemon
      - run: echo "Windows runtime adapters are under construction 🚧"
