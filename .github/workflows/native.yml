name: Native distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3 libnghttp2 || true
      - run: ./gradlew test :core:model:allTests :host:native:macosArm64Test :apps:native-cli:macosArm64Test :apps:native-cli:linkReleaseExecutableMacosArm64 --no-daemon
      - run: |
          mkdir -p dist/lynx-skill
          cp apps/native-cli/build/bin/macosArm64/releaseExecutable/lynx.kexe dist/lynx
          SSL_PREFIX="$(brew --prefix openssl@3)"
          H2_PREFIX="$(brew --prefix libnghttp2)"
          cp "$SSL_PREFIX/lib/libssl.3.dylib" "$SSL_PREFIX/lib/libcrypto.3.dylib" dist/
          cp "$H2_PREFIX/lib/libnghttp2.14.dylib" dist/
          install_name_tool -change "$SSL_PREFIX/lib/libssl.3.dylib" '@rpath/libssl.3.dylib' dist/lynx
          install_name_tool -change "$SSL_PREFIX/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' dist/lynx
          install_name_tool -change "$H2_PREFIX/lib/libnghttp2.14.dylib" '@rpath/libnghttp2.14.dylib' dist/lynx
          install_name_tool -add_rpath '@executable_path' dist/lynx
          cp docs/agent-skill/SKILL.md dist/lynx-skill/SKILL.md
          tar -czf dist/lynx-macos-arm64.tar.gz -C dist lynx libssl.3.dylib libcrypto.3.dylib libnghttp2.14.dylib lynx-skill
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-macos-arm64
          path: dist/lynx-macos-arm64.tar.gz

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev libnghttp2-dev patchelf
      - run: ./gradlew test :core:model:allTests :apps:native-cli:linkReleaseExecutableLinuxX64 --no-daemon
      - name: Run Linux native network smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/apps/native-cli/build/bin/linuxX64/releaseExecutable/lynx.kexe"
          test -x "$BIN"
          export LYNX_EXECUTABLE="$BIN"
          python3 -m http.server 38133 --bind 127.0.0.1 >/tmp/lynx-linux-http.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true; "$BIN" network stop --json >/dev/null 2>&1 || true' EXIT
          "$BIN" network start --port 62006 --json
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --noproxy '' \
              -x http://127.0.0.1:62006 \
              http://127.0.0.1:38133/README.md \
              -o /tmp/lynx-linux-http-body -w '%{http_code}' >/tmp/lynx-linux-http-status; then
              break
            fi
            sleep 0.2
          done
          test "$(cat /tmp/lynx-linux-http-status)" = 200
          LIST="$($BIN network list --json)"
          printf '%s' "$LIST" | grep -q '"method":"GET"'
          printf '%s' "$LIST" | grep -q '"status":200'
          CA="$($BIN network ca install --json)"
          printf '%s' "$CA" | grep -q '"configured":true'
          printf '%s' "$CA" | grep -q 'user_installation_required'
          "$BIN" network ca remove --json
          "$BIN" network doctor --json
          "$BIN" network stop --json
      - run: |
          mkdir -p dist/lynx-skill
          cp apps/native-cli/build/bin/linuxX64/releaseExecutable/lynx.kexe dist/lynx
          cp /usr/lib/x86_64-linux-gnu/libssl.so.3 dist/
          cp /usr/lib/x86_64-linux-gnu/libcrypto.so.3 dist/
          cp /usr/lib/x86_64-linux-gnu/libnghttp2.so.14 dist/
          patchelf --set-rpath '$ORIGIN' dist/lynx
          cp docs/agent-skill/SKILL.md dist/lynx-skill/SKILL.md
          tar -czf dist/lynx-linux-x64.tar.gz -C dist lynx libssl.so.3 libcrypto.so.3 libnghttp2.so.14 lynx-skill
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-linux-x64
          path: dist/lynx-linux-x64.tar.gz

  windows-common:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "Windows KMP runtime adapters and MinGW executable are under construction 🚧"
