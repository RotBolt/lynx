name: Native distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3 || true
      - run: ./gradlew test :core:model:allTests :host:native:macosArm64Test :apps:native-cli:macosArm64Test :apps:native-cli:linkReleaseExecutableMacosArm64 --no-daemon
      - run: |
          mkdir -p dist/lynx-skill
          cp apps/native-cli/build/bin/macosArm64/releaseExecutable/lynx.kexe dist/lynx
          cp docs/agent-skill/SKILL.md dist/lynx-skill/SKILL.md
          tar -czf dist/lynx-macos-arm64.tar.gz -C dist lynx lynx-skill
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-macos-arm64
          path: dist/lynx-macos-arm64.tar.gz

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev
      - run: ./gradlew test :core:model:allTests :apps:native-cli:linkReleaseExecutableLinuxX64 --no-daemon
      - name: Run Linux native network smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/apps/native-cli/build/bin/linuxX64/releaseExecutable/native-cli.kexe"
          export LYNX_EXECUTABLE="$BIN"
          "$BIN" network doctor --json
          "$BIN" network start --port 62006 --json
          "$BIN" network list --json
          "$BIN" network stop --json
      - run: |
          mkdir -p dist/lynx-skill
          cp apps/native-cli/build/bin/linuxX64/releaseExecutable/lynx.kexe dist/lynx
          cp docs/agent-skill/SKILL.md dist/lynx-skill/SKILL.md
          tar -czf dist/lynx-linux-x64.tar.gz -C dist lynx lynx-skill
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-linux-x64
          path: dist/lynx-linux-x64.tar.gz

  windows-common:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "Windows KMP runtime adapters and MinGW executable are under construction 🚧"
