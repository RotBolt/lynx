name: Native distributions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3 libnghttp2 brotli
      - run: ./gradlew test :host:network:jvmTest :core:model:allTests :host:network:macosArm64Test :host:native:macosArm64Test :apps:cli:macosArm64Test :apps:cli:linkReleaseExecutableMacosArm64 --no-daemon
      - run: |
          mkdir -p dist/lynx-skill
          cp apps/cli/build/bin/macosArm64/releaseExecutable/lynx.kexe dist/lynx
          SSL_PREFIX="$(brew --prefix openssl@3)"
          H2_PREFIX="$(brew --prefix libnghttp2)"
          BROTLI_PREFIX="$(brew --prefix brotli)"
          cp "$SSL_PREFIX/lib/libssl.3.dylib" "$SSL_PREFIX/lib/libcrypto.3.dylib" dist/
          cp "$H2_PREFIX/lib/libnghttp2.14.dylib" dist/
          cp "$BROTLI_PREFIX/lib/libbrotlidec.1.dylib" "$BROTLI_PREFIX/lib/libbrotlicommon.1.dylib" dist/
          install_name_tool -change "$SSL_PREFIX/lib/libssl.3.dylib" '@rpath/libssl.3.dylib' dist/lynx
          install_name_tool -change "$SSL_PREFIX/lib/libcrypto.3.dylib" '@rpath/libcrypto.3.dylib' dist/lynx
          install_name_tool -change "$H2_PREFIX/lib/libnghttp2.14.dylib" '@rpath/libnghttp2.14.dylib' dist/lynx
          install_name_tool -change "$BROTLI_PREFIX/lib/libbrotlidec.1.dylib" '@rpath/libbrotlidec.1.dylib' dist/lynx
          install_name_tool -id '@rpath/libbrotlidec.1.dylib' dist/libbrotlidec.1.dylib
          install_name_tool -id '@rpath/libbrotlicommon.1.dylib' dist/libbrotlicommon.1.dylib
          install_name_tool -add_rpath '@executable_path' dist/lynx
          codesign --force --sign - dist/*.dylib dist/lynx
          cp docs/agent-skill/SKILL.md dist/lynx-skill/SKILL.md
          tar -czf dist/lynx-macos-arm64.tar.gz -C dist lynx libssl.3.dylib libcrypto.3.dylib libnghttp2.14.dylib libbrotlidec.1.dylib libbrotlicommon.1.dylib lynx-skill
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-macos-arm64
          path: dist/lynx-macos-arm64.tar.gz

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev libnghttp2-dev libbrotli-dev patchelf
      - run: ./gradlew test :host:network:jvmTest :core:model:allTests :host:network:linuxX64Test :apps:cli:linkReleaseExecutableLinuxX64 --no-daemon
      - name: Run Linux native network smoke test
        shell: bash
        run: |
          BIN="$PWD/apps/cli/build/bin/linuxX64/releaseExecutable/lynx.kexe"
          ./scripts/native-linux-smoke.sh "$BIN"
      - run: |
          ./scripts/package-linux-native.sh \
            apps/cli/build/bin/linuxX64/releaseExecutable/lynx.kexe \
            dist/lynx-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-linux-x64
          path: dist/lynx-linux-x64.tar.gz

  windows-common:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "Windows KMP runtime adapters and MinGW executable are under construction 🚧"
